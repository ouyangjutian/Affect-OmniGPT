name: vllm

channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # =========================
  # Python
  # =========================
  - python=3.10
  - pip

  # =========================
  # Build tools
  # =========================
  - git
  - wget
  - ninja
  - cmake
  - gcc_linux-64=12
  - gxx_linux-64=12

  # =========================
  # CUDA
  # =========================
  - cuda-toolkit=12.8

  # =========================
  # Utils
  # =========================
  - ffmpeg

  - pip:

      # ==========================================
      # PyTorch Nightly (Blackwell / sm_120)
      # ==========================================
      - --pre
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu128

      - torch
      - torchvision
      - torchaudio

      # ==========================================
      # Core LLM
      # ==========================================
      - transformers>=4.51.0
      - accelerate>=1.5.0
      - peft>=0.15.0
      - sentencepiece
      - safetensors
      - tokenizers
      - tiktoken

      # ==========================================
      # vLLM
      # ==========================================
      - vllm>=0.8.5

      # ==========================================
      # xformers
      # ==========================================
      - xformers

      # ==========================================
      # Training
      # ==========================================
      - datasets
      - scipy
      - scikit-learn
      - pandas
      - numpy
      - matplotlib
      - tqdm
      - pyyaml
      - omegaconf
      - einops
      - timm
      - pytorch-lightning
      - lightning
      - tensorboard

      # ==========================================
      # Vision
      # ==========================================
      - pillow
      - opencv-python
      - decord
      - av
      - imageio

      # ==========================================
      # Audio
      # ==========================================
      - librosa
      - soundfile
      - ffmpeg-python

      # ==========================================
      # API / Demo
      # ==========================================
      - fastapi
      - uvicorn
      - gradio

      # ==========================================
      # Misc
      # ==========================================
      - rich
      - ipython
      - jupyter
      - wandb
      - nltk
      - sentencepiece
      - protobuf
